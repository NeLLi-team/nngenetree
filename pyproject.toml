[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nngenetree"
version = "2.0.0"
description = "NNGeneTree - Phylogenetic analysis pipeline with Prefect-Dask"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "NNGeneTree Development Team" }
]
dependencies = [
    "dask>=2024.11,<2026",
    "distributed>=2024.11,<2026",
    "dask-jobqueue>=0.9,<1",
    "biopython>=1.80,<2",
    "ete3>=3.1.0,<4",
    "pandas>=2.0,<3",
    "numpy>=1.24,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
]

[project.scripts]
nngenetree = "nngenetree.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nngenetree"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
